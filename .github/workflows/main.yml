name: Cron para Vercel

on:
  schedule:
    - cron: "*/15 * * * *" # executa a cada 15 minutos
  workflow_dispatch:

jobs:
  call-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Chama o rodaCron com o segredo do agendador
        env:
          CRON_DISPATCH_SECRET: ${{ secrets.CRON_DISPATCH_SECRET }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
          CRON_URL: ${{ vars.CRON_URL || 'https://homol.pflix.com.br/api/rodaCron' }}
        run: |
          curl -fSL -X POST "$CRON_URL" \
            -H "x-cron-secret: $CRON_DISPATCH_SECRET" \
            -H "x-vercel-protection-bypass: $VERCEL_BYPASS_TOKEN"
